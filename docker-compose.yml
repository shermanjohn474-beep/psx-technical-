services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/psx.sqlite3}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - psx-data:/data
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "8080:80"
  # Optional PostgreSQL (set DATABASE_URL=postgresql+psycopg://psx:psx@db:5432/psx and add psycopg to requirements)
  # db:
  #   image: postgres:16-alpine
  #   environment: { POSTGRES_USER: psx, POSTGRES_PASSWORD: psx, POSTGRES_DB: psx }
  #   volumes: [pg-data:/var/lib/postgresql/data]
volumes:
  psx-data:
